<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
    <style>
      body {
        background-color: white;
        /* text-align: center;
            justify-content: center; */
      }

      .delete {
        background-color: seagreen;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        margin-left: 70px;
        border-radius: 5px;
      }

      button {
        /* margin-top: 10px; */
        margin-left: 150px;
        color: seagreen;
        border: 1px solid white;
      }

      #filter {
        color: seagreen;
        padding: 8px 16px;
        border: 1px solid seagreen;
        /* border-color: transparent transparent rgba(0, 0, 0, 0.1) transparent; */
        cursor: pointer;
      }

      .container {
        /* border: 1px solid palevioletred;   */
        height: 220px;
        width: 300px;
        margin: auto;
      }

      input {
        border: 1px solid rgb(69, 122, 92);
        margin-bottom: 10px;
        margin-left: 10px;
        margin-top: 10px;
        width: 250px;
        height: 25px;
        text-align: center;
        border-radius: 5px;
      }

      h1 {
        color: seagreen;
        text-align: center;
      }

      .form-control {
        width: 300px;

        background-color: rgb(60, 128, 94);
      }

      ul {
        padding: 0;
        list-style: none;
      }

      ul li {
        border: 2px solid rgb(99, 170, 96);
        color: seagreen;
        border-collapse: collapse;
        height: auto;
        width: 99%;
        padding: 20px;
        margin-left: 10px 0;
        font-size: 22px;
      }

      h2 {
        color: seagreen;
        text-align: center;
      }

      #search {
        background-color: aliceblue;
        border: 1px solid seagreen;
        width: 99%;
        height: 30px;
      }
    </style>
  </head>

  <body>
    <h1>Student Details</h1>
    <div class="container">
      <form onsubmit="saveStudentRecord(event)" id="f" class="form-control">
        <input type="text" placeholder="Enter Username" id="name" required />
        <br />
        <input type="number" placeholder="Enter age" id="age" required /><br />

        <input
          type="number"
          placeholder="Enter grade"
          id="grade"
          required
        /><br />

        <button class="btn btn-success" type="submit">submit</button>
        <br />
      </form>
    </div>
    <h1>Search</h1>
    <div>
      <input
        type="text"
        id="search"
        placeholder="search by name "
        oninput="searchstu()"
        class="form-control"
      />
    </div>
    <!-- <button class="btn btn-success" id="btn" onclick="searchstu()">Search</button> -->
    <h1>Filter</h1>
    <select name="select" id="filter">
      <option value="80">80</option>
      <option value="90">90</option>
      <option value="60">60</option>
      <option value="40">40</option>
    </select>
    <button  class="btn btn-success" id="btn" onclick="filter()">Filter</button>
    <button  class="btn btn-success" id="atoz" onclick="sorta()">Sort A-Z</button>
    <button  class="btn btn-success" id="ztoa" onclick="sortz()">Sort Z-A</button>

    <h2>Store details</h2>
    <ul id="userList"></ul>
    <div
       style="
        background-color: rgba(0, 0, 0, 0.8);
        position: absolute;
        height: 100%;
        width: 100%;
        top: 0;
        left: 0;
        display: none;
      "
      id="edit"
    > 
      <form
        
        id="secondform"
        class="form-control "
        style="height: auto; width: auto; margin: auto"
      >
        <h1 style="color: beige;">Edit Here</h1>
        <input
          type="text"
          placeholder="Enter Username"
          id="secondname"
          required
        />
        <br />
        <input
          type="number"
          placeholder="Enter age"
          id="secondage"
          required
        /><br />

        <input
          type="number"
          placeholder="Enter grade"
          id="secondgrade"
          required
        /><br />

        <button style="margin: 15px;" class="btn btn-success" type="submit">submit</button>
        
       <button style="margin: 15px;" class="btn btn-success" id="close" onclick="closeedit()">close</button>
        <br />
      </form>
    </div>

    <script>
      let array = JSON.parse(localStorage.getItem("Students")) || [];
      let currentYear = new Date().getFullYear();

        // fetch stuent record at the page load
      function fetchstudentrecord() {
        let array = JSON.parse(localStorage.getItem("Students")) || [];
        displayStudentArray(array);
        

      }
      //   function call to page load the data inintally
      fetchstudentrecord();
      //   save the records for student
      function saveStudentRecord(event) {
        event.preventDefault();
        const name = document.getElementById("name").value;
        const age = document.getElementById("age").value;
        const grade = document.getElementById("grade").value;
        console.log("Form Details:", { name, age, grade });
        const studentdetails = {
          name,
          age,
          grade,
          stu_id: `STU_${currentYear}-${String(array.length + 1).padStart(
            6,
            "0"
          )}`,
        };
        array.push(studentdetails);
        // let studetails = JSON.parse(localStorage.getItem("students"));
        console.log(array);

        localStorage.setItem("Students", JSON.stringify(array));
        displayStudentArray(array);
        document.getElementById("f").reset();
      }

      //   searcht the student records
      function searchstu() {
        let emptyarray = [];
        let search = document.getElementById("search").value;

        array.forEach((students) => {
          if (search.toLowerCase() === students.name.toLowerCase()) {
            emptyarray.push(students);
          }
        });
        displayStudentArray(emptyarray);
      }

      //  filter the students record
      function filter() {
        let fil_value = document.getElementById("filter");
        const filtervalue = fil_value.value;

        let emparray = [];

        array.forEach((students) => {
          if (filtervalue === students.grade) {
            emparray.push(students);
          }
        });

        // Loop through users array and display each user
        displayStudentArray(emparray);
      }
      function sorta() {
        // let sorted = array.sort();
        // console.log("sorted");
        // console.log(sorted)
        let sortedarray = JSON.parse(localStorage.getItem("Students")) || [];

        sortedarray.sort((a, b) => {
          const nameA = a.name.toUpperCase(); // ignore upper and lowercase
          const nameB = b.name.toUpperCase(); // ignore upper and lowercase
          if (nameA < nameB) {
            return -1;
            console.log("first");
          }
          if (nameA > nameB) {
            return 1;
            ("second");
          }
          return 0;
          console.log("third");
        });
        displayStudentArray(sortedarray);
      }
      function sortz() {
        let sorted = JSON.parse(localStorage.getItem("Students")) || [];

        sorted.sort((a, b) => {
          const nameA = a.name.toUpperCase(); // ignore upper and lowercase
          const nameB = b.name.toUpperCase(); // ignore upper and lowercase
          if (nameA > nameB) {
            return -1;
            console.log("first");
          }
          if (nameA < nameB) {
            return 1;
            ("second");
          }
          return 0;
          console.log("third");
        });
        displayStudentArray(sorted);
      }

      function edit(id) {
        console.log("message",id)

        document.getElementById("edit").style.display = "flex";
        const namesec = document.getElementById("secondname");
        const agesec = document.getElementById("secondage");
        const gradesec = document.getElementById("secondgrade");
        console.log("Form Details:", { namesec, agesec, gradesec });


        let secondFormArray =JSON.parse(localStorage.getItem("Students")) || [];
        console.log(secondFormArray);
        secondFormArray.forEach((student) => {
          console.log("--->",student)
          
          if (student.stu_id === id) {
            console.log("working")
            namesec.value =student.name;
            agesec.value=student.age;
            gradesec.value=student.grade;
          }
        });

        document.getElementById("secondform").addEventListener("submit",function(event){
          event.preventDefault();
          updatestudentrecord(id);
        })
      
      }
      function updatestudentrecord(studentid){

      
           console.log(studentid);
           const studentsupdatearray=JSON.parse(localStorage.getItem("Students")) || [];
           let updatestudentarray=[]
           studentsupdatearray.forEach((student) => {
              if(student.stu_id === studentid){
                updatestudentarray.push({
                  name : document.getElementById("secondname").value,
                  age : document.getElementById("secondage").value,
                  grade : document.getElementById("secondgrade").value,
                  stu_id:student.stu_id
                })}
              else{
                updatestudentarray.push(student);
              }  
      })
      localStorage.setItem("Students",JSON.stringify(updatestudentarray));
      displayStudentArray(updatestudentarray)
      closeedit();

    }
      // function to delete the student record
      function deleteRecord(id) {
        const studentId = id;

        let studentDetailsArray =
          JSON.parse(localStorage.getItem("Students")) || [];
        let newStudentsArray = [];

        studentDetailsArray.forEach((stu_record) => {
          console.log(typeof studentId);
          if (stu_record.stu_id !== studentId) {
            console.log("---->", stu_record);
            newStudentsArray.push(stu_record);
          }
        });

        console.log("records->", newStudentsArray);

        localStorage.setItem("Students", JSON.stringify(newStudentsArray));
        // setStudentsRow(newStudentsArray);

        displayStudentArray(newStudentsArray);
      }
      //   --------------------------------
      function displayStudentArray(stuArray) {
        console.log("---", stuArray);
        const userList = document.getElementById("userList");
        userList.innerHTML = "";

        stuArray.forEach((students, index) => {
          const listItem = document.createElement("li");
          listItem.setAttribute("id", `${students.stu_id}`);
          listItem.textContent = `students ${index + 1}:  ${
            students.name
          }, Age: ${students.age}, grade: ${students.grade},stu_id: ${
            students.stu_id
          }`;
          const button = document.createElement("button");
          button.textContent = "delete";
          button.className = "delete";
          button.setAttribute("id", `${students.stu_id}`);
          button.addEventListener("click", function () {
            deleteRecord(`${students.stu_id}`);
          });
          listItem.appendChild(button);
          userList.appendChild(listItem);

          const editbutton = document.createElement("button");
          editbutton.textContent = "edit";
          editbutton.className = "delete";
          editbutton.setAttribute("id", `${students.name}`);
          editbutton.addEventListener("click", function () {
            
            edit(`${students.stu_id}`);
          });

          listItem.appendChild(editbutton);
          userList.appendChild(listItem);
        });
      }
      //to close the second form
      function closeedit(){
        document.getElementById("edit").style.display="none";
      }
    </script>
  </body>
</html>
