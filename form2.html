<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
    <style>
        body {
            background-color: beige;
        }

        button {
            margin-top: 10px;
            margin-left: 10px;
            color: seagreen;
            border: 1px solid white;
        }

        .container {
            margin-left: 20px;
            /* border: 1px solid palevioletred;  */
            height: 440px;
            width: 50%;
        }

        input {
            border: 1px solid rgb(69, 122, 92);
            margin-bottom: 10px;
            margin-left: 10px;
            margin-top: 10px;
            width: 300px;
            height: 30px;
            text-align: center;
            border-radius: 5px;

        }

        h1 {
            color: seagreen;
        }

        .form-control {
            width: 340px;
            background-color: rgb(60, 128, 94);
        }

        ul {
            border: 2px solid rgb(99, 170, 96);
            color: seagreen;
            border-collapse: collapse;
            height: auto;
            width: 350px;
            padding: 20px;
            margin-left: 10px;
        }

        h2 {
            color: seagreen;
        }

        #search {
            background-color: aliceblue;
            border: 3px solid seagreen;
        }
    </style>
</head>

<body>
    <div class="container ">
        <h1>Student Details</h1>
        <form onsubmit="signup(event)" id="f" class="form-control ">
            <input type="text" placeholder="Enter Username" id="name" required>
            <br>
            <input type="number" placeholder="Enter age" id="age" required><br>

            <input type="number" placeholder="Enter grade" id="grade" required><br>
            <button class="btn btn-success" type="submit">submit</button>
            <br>

        </form><br>
        <h1>Search </h1>
        <div><input type="text" id="search" placeholder="search by name " oninput="searchstu()" class="form-control">
        </div>
        <!-- <button class="btn btn-success" id="btn" onclick="searchstu()">Search</button> -->
        <h1>Filter</h1>
        <select name="select" id="filter">
            <option value="80">80</option>
            <option value="90">90</option>
            <option value="60">60</option>
            <option value="40">40</option>
        </select>
        <button class="btn btn-success" id="btn" onclick="filter()">Filter</button>
        <h2>Store details
        </h2>
        <ul id="userList"></ul>
    </div>

    <script>
        let array = JSON.parse(localStorage.getItem("Students")) || [];
        updateUserList();

        function signup(event) {
            event.preventDefault();
            const name = document.getElementById("name").value;
            const age = document.getElementById("age").value;
            const grade = document.getElementById("grade").value;
            console.log("Form Details:", { name, age, grade });
            const studentdetails = { name, age, grade };
            array.push(studentdetails);
            // let studetails = JSON.parse(localStorage.getItem("students"));
            console.log(array);

            localStorage.setItem("Students", JSON.stringify(array));
            updateUserList();
            document.getElementById("f").reset();



        }
        // Function to display the array
        function updateUserList() {
            const userList = document.getElementById('userList');
            userList.innerHTML = '';



            // Loop through users array and display each user
            array.forEach((students, index) => {
                const listItem = document.createElement('li');
                listItem.textContent = `students ${index + 1}:  ${students.name}, Age: ${students.age}, grade: ${students.grade}`;
                userList.appendChild(listItem);
            })
        }
        // searech student
        function searchstu() {
            let emptyarray = [];
            let search = document.getElementById("search").value;

            array.forEach((students) => {

                if (search.toLowerCase() === students.name.toLowerCase()) {
                    emptyarray.push(students);
                }
            })
            console.log("----", emptyarray)
            // searchstudents(emptyarray)


            const userList = document.getElementById('userList');
            userList.innerHTML = '';



            // Loop through users array and display each user
            emptyarray.forEach((students, index) => {
                const listItem = document.createElement('li');
                listItem.textContent = `students ${index + 1}:  ${students.name}, Age: ${students.age}, grade: ${students.grade}`;
                userList.appendChild(listItem);
            })
        }
        function filter() {
            let fil_value = document.getElementById("filter");
            const filtervalue =  fil_value.value
            
            let emparray = [];
            

            array.forEach((students) => {

                if (filtervalue === students.grade) {
                    emparray.push(students);
                }
            })
            console.log("----", emparray)
            // searchstudents(emptyarray)


            const userList = document.getElementById('userList');
            userList.innerHTML = '';



            // Loop through users array and display each user
            emparray.forEach((students, index) => {
                const listItem = document.createElement('li');
                listItem.textContent = `students ${index + 1}:  ${students.name}, Age: ${students.age}, grade: ${students.grade}`;
                userList.appendChild(listItem);
            })
        }

    </script>
</body>

</html>
