<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Blog form</title>
    <style>
         body{
            background-color: rgb(247, 239, 240);
        }
        button{
            margin-top: 10px;
            margin-left: 10px;
        }
        
        .container {
            justify-content: center;
            align-items: center;
             border: 1px solid rgb(253, 202, 218); 
            height: 360px;
            width: 325px;
            margin: auto;
            background-color: white;
            box-shadow: 0 0 15px lightcoral;
        }

        input {
            border: 1px solid pink;
            margin-bottom: 10px;
            
            margin-top: 10px;
            width: 300px;
            height: 30px;
            text-align: center;
            border-radius: 5px;
            background-color: rgb(253, 221, 226);
            
        }
        textarea{
            background-color: rgb(253, 221, 226);
            border: 1px solid pink;
            margin-bottom: 10px;
           
            margin-top: 10px;
            width: 300px;
            
            text-align: center;
            border-radius: 5px;
        }

        h1 {
            color: lightcoral;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Post a Blog Card </h1>

    
        <div class="container">
            <form onsubmit="signup(event)">
               
                    
                    <input type="text" placeholder="Enter Title" id="title" required><br>
                    <input type="text" id="img" placeholder="enter image URL">
                    <textarea name="" rows="5" placeholder="Enter description" id="desc"></textarea><br>
                    <input type="text" placeholder="Enter name" id="name" required><br>
                    <button class="btn btn-danger" type="submit">submit</button>
                    
                </form>
            </div>        
        </div>

    
</body>
<script>
     function signup(event){
        let array = JSON.parse(localStorage.getItem("Details")) || [];
        let titlevalue=document.getElementById("title").value;
        let img=document.getElementById("img").value;
        let descvalue=document.getElementById("desc").value;
        let namevalue=document.getElementById("name").value;

        const details={titlevalue,img,descvalue,namevalue};
        array.push(details)
        localStorage.setItem("Details", JSON.stringify(array));
     }
</script>
</html>
