        function displayBlogCards() {
          const blogContainer = document.getElementById("container");
          let   blogs = JSON.parse(localStorage.getItem("Details")) || [];


          let blogHtml = "";

          blogs.forEach((blog) => {
            blogHtml += `
             <div class="blog-card">
          <img
            style="width: 100%; height: 200px; border-radius: 10px 10px 0px 0px"
            alt="blog image"
            src="${blog.img}"
          />
          <div style="padding: 1rem">
            <h4>${blog.titlevalue}</h4>
            <br />
            <p>
              ${blog.descvalue}
            </p>
            <div>
              <br />
              <p><i style="color: grey;" >${blog.namevalue}</i></p>
            </div>
          </div>
        </div>
            `;
          });

          blogContainer.innerHTML = blogHtml;
        }

        displayBlogCards()
